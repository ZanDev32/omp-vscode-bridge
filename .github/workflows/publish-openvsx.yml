name: Publish to Open VSX

# Authenticates with a personal access token stored as the repository secret OVSX_PAT.
# Create one at https://open-vsx.org/user-settings/tokens (scope: publish to `zandev32`).
# Trusted publishing (OIDC, no secret) is a later migration — see docs/development.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "publishing v${version}"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Package
        run: bun run package

      - name: Verify the token can publish
        if: ${{ !inputs.dry_run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::OVSX_PAT is not set. Add a repository secret holding an Open VSX access token."
            exit 1
          fi
          npx --yes ovsx verify-pat zandev32 -p "${OVSX_PAT}"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish ./*.vsix -p "${OVSX_PAT}"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
